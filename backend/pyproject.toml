[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "genai-backend"
version = "0.1.0"
description = "Backend foundation for the multi-tenant agent platform."
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13.3",
  "asyncpg>=0.29.0",
  "email-validator>=2.2.0",
  "fastapi>=0.115.0",
  "httpx>=0.27.2",
  "langgraph>=0.2.74",
  "opentelemetry-api>=1.28.0",
  "opentelemetry-sdk>=1.28.0",
  "opentelemetry-instrumentation-fastapi>=0.49b0",
  "opentelemetry-instrumentation-asyncpg>=0.49b0",
  "opentelemetry-instrumentation-redis>=0.49b0",
  "opentelemetry-instrumentation-httpx>=0.49b0",
  "opentelemetry-exporter-otlp-proto-grpc>=1.28.0",
  "pwdlib[argon2]>=0.2.1",
  "pydantic>=2.8.2",
  "pydantic-settings>=2.4.0",
  "pyjwt>=2.9.0",
  "pypdf>=5.0.0",
  "python-docx>=1.1.2",
  "psycopg[binary]>=3.2.1",
  "qdrant-client>=1.12.0",
  "cryptography>=42.0.0",
  "openai>=1.0.0",
  "python-multipart>=0.0.9",
  "redis>=5.0.8",
  "sqlalchemy[asyncio]>=2.0.34",
  "tiktoken>=0.7.0",
  "uvicorn[standard]>=0.30.6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.2",
  "pytest-asyncio>=0.24.0",
]

[tool.setuptools.packages.find]
include = ["api*", "app*", "database*", "dependencies*", "engine*", "rag*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
  "ignore::langchain_core._api.deprecation.LangChainPendingDeprecationWarning",
  "ignore::UserWarning:qdrant_client.async_qdrant_remote",
]
