<!doctype html>
<html lang="pt-BR" class="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GENAI | Ativar Conta</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@1.14.0/dist/umd/lucide.min.js"></script>
  <style type="text/tailwindcss">
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
    @import "tailwindcss";

    @theme {
      --font-sans: "Inter", ui-sans-serif, system-ui, sans-serif;
      --font-display: "Space Grotesk", ui-sans-serif, system-ui, sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, monospace;
      --color-canvas: var(--canvas);
      --color-surface: var(--surface);
      --color-surface-hover: var(--surface-hover);
      --color-border: var(--border);
      --color-border-hover: var(--border-hover);
      --color-text-main: var(--text-main);
      --color-text-muted: var(--text-muted);
    }

    :root {
      --canvas: #f8fafc;
      --surface: #ffffff;
      --surface-hover: #fbfcfd;
      --border: #e2e8f0;
      --border-hover: #cbd5e1;
      --text-main: #0f172a;
      --text-muted: #475569;
      --glow-opacity: 0.05;
    }

    .dark {
      --canvas: #0a0a0f;
      --surface: rgba(255, 255, 255, 0.03);
      --surface-hover: rgba(255, 255, 255, 0.06);
      --border: rgba(255, 255, 255, 0.07);
      --border-hover: rgba(255, 255, 255, 0.12);
      --text-main: #ffffff;
      --text-muted: #94a3b8;
      --glow-opacity: 0.15;
    }

    body {
      background-color: var(--canvas);
      color: var(--text-main);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

    .glass-card {
      background-color: var(--surface);
      border: 1px solid var(--border);
      transition: all 0.3s ease;
    }
    .glass-card:hover {
      background-color: var(--surface-hover);
      border-color: var(--border-hover);
    }

    .input-field {
      background-color: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-main);
      transition: all 0.2s ease;
    }
    .input-field:focus {
      outline: none;
      border-color: theme('colors.blue.500');
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.08);
      background-color: var(--surface-hover);
    }

    .glow-btn {
      position: relative;
      overflow: hidden;
    }
    .glow-btn::after {
      content: '';
      position: absolute;
      inset: -2px;
      border-radius: inherit;
      background: linear-gradient(135deg, rgba(59,130,246,0.3), rgba(6,182,212,0.3));
      opacity: 0;
      transition: opacity 0.3s ease;
      z-index: -1;
      filter: blur(8px);
    }
    .glow-btn:hover::after { opacity: 1; }

    @keyframes pulse-ring {
      0% { box-shadow: 0 0 0 0 rgba(59,130,246,0.2); }
      70% { box-shadow: 0 0 0 12px rgba(59,130,246,0); }
      100% { box-shadow: 0 0 0 0 rgba(59,130,246,0); }
    }
    .pulse-ring {
      animation: pulse-ring 2s ease-in-out infinite;
    }

    @keyframes breathe {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.05); }
    }
    .animate-breathe { animation: breathe 3s ease-in-out infinite; }
  </style>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();

      const themeToggle = document.getElementById('theme-toggle');
      const savedTheme = localStorage.getItem('theme');
      if (savedTheme === 'light') { document.documentElement.classList.remove('dark'); }
      if (savedTheme) { updateThemeIcon(); lucide.createIcons(); }

      themeToggle.addEventListener('click', () => {
        document.documentElement.classList.toggle('dark');
        updateThemeIcon();
        lucide.createIcons();
        localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
      });

      function updateThemeIcon() {
        const isDark = document.documentElement.classList.contains('dark');
        const icon = themeToggle.querySelector('i') || themeToggle.querySelector('svg');
        if (icon) icon.setAttribute('data-lucide', isDark ? 'sun' : 'moon');
      }

      // Code input auto-advance
      const codeInputs = document.querySelectorAll('.code-input');
      codeInputs.forEach((input, i) => {
        input.addEventListener('input', (e) => {
          const val = e.target.value.replace(/\D/g, '');
          e.target.value = val;
          if (val && i < codeInputs.length - 1) { codeInputs[i + 1].focus(); }
        });
        input.addEventListener('keydown', (e) => {
          if (e.key === 'Backspace' && !e.target.value && i > 0) { codeInputs[i - 1].focus(); }
        });
      });

      // Timer
      function startTimer(duration) {
        const display = document.getElementById('timer');
        let time = duration;
        const interval = setInterval(() => {
          const m = Math.floor(time / 60);
          const s = time % 60;
          display.textContent = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
          if (--time < 0) { clearInterval(interval); display.textContent = '00:00'; }
        }, 1000);
      }
      startTimer(600);

      // Resend button
      document.getElementById('resend-btn').addEventListener('click', function() {
        this.disabled = true;
        this.innerHTML = '<i data-lucide="loader-circle" class="w-3.5 h-3.5 animate-spin"></i> Reenviando...';
        lucide.createIcons();
        setTimeout(() => {
          this.disabled = false;
          this.innerHTML = 'Reenviar codigo';
          lucide.createIcons();
          startTimer(600);
        }, 2000);
      });

      // Activate
      document.getElementById('activate-btn').addEventListener('click', function() {
        const allFilled = Array.from(codeInputs).every(i => i.value);
        if (!allFilled) {
          codeInputs.forEach(i => {
            if (!i.value) { i.classList.add('error'); setTimeout(() => i.classList.remove('error'), 1000); }
          });
          return;
        }
        this.innerHTML = '<i data-lucide="loader-circle" class="w-4 h-4 animate-spin"></i> Verificando...';
        lucide.createIcons();
        setTimeout(() => {
          this.innerHTML = '<i data-lucide="check-circle" class="w-4 h-4"></i> Conta ativada!';
          this.className = 'w-full bg-emerald-500 text-white py-3 rounded-lg text-sm font-semibold flex items-center justify-center gap-2 cursor-pointer';
          lucide.createIcons();
        }, 2000);
      });
    });
  </script>
</head>

<body class="h-screen flex overflow-hidden selection:bg-blue-500/30 font-sans">

  <!-- Ambient Glows -->
  <div class="fixed top-[-15%] left-[-5%] w-[600px] h-[600px] rounded-full bg-blue-600/8 blur-[160px] pointer-events-none"></div>
  <div class="fixed bottom-[-15%] right-[-5%] w-[500px] h-[500px] rounded-full bg-cyan-600/5 blur-[140px] pointer-events-none"></div>

  <div class="flex-1 flex items-center justify-center p-6 relative z-10">
    <div class="w-full max-w-[440px]">

      <!-- Top bar -->
      <div class="flex items-center justify-between mb-10">
        <div class="flex items-center gap-2.5">
          <i data-lucide="bot" class="w-6 h-6 text-blue-500"></i>
          <span class="font-display font-semibold text-lg text-text-main tracking-tight">GENAI</span>
        </div>
        <button id="theme-toggle" title="Toggle Theme"
          class="p-2 rounded-lg glass-card text-text-muted hover:text-text-main transition-colors cursor-pointer">
          <i data-lucide="sun" class="w-4 h-4"></i>
        </button>
      </div>

      <!-- Activation Card -->
      <div class="glass-card rounded-xl p-8">

        <!-- Back link -->
        <a href="login.html"
          class="inline-flex items-center gap-1.5 text-xs text-text-muted hover:text-blue-500 transition-colors mb-6">
          <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i> Voltar ao login
        </a>

        <!-- Icon with pulse ring -->
        <div class="relative w-16 h-16 mb-5">
          <div class="absolute inset-0 rounded-2xl bg-blue-500/10 pulse-ring"></div>
          <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-blue-500/15 to-sky-500/15 border border-blue-500/25 flex items-center justify-center relative z-10">
            <i data-lucide="shield-half" class="w-7 h-7 text-blue-400"></i>
          </div>
        </div>

        <h2 class="text-xl font-display font-semibold text-text-main tracking-tight mb-1">Ative sua conta</h2>
        <p class="text-sm text-text-muted mb-6 leading-relaxed">
          Enviamos um codigo de 6 digitos para
          <span class="text-text-main font-medium">l***s@acme.com</span>.
          Insira abaixo para ativar sua conta.
        </p>

        <!-- Code Input -->
        <div class="flex justify-center gap-2.5 mb-6">
          <input type="text" maxlength="1"
            class="code-input w-11 h-13 text-center text-xl font-display font-semibold input-field rounded-lg border-border focus:border-blue-500 focus:ring-2 focus:ring-blue-500/15 transition-all" />
          <input type="text" maxlength="1"
            class="code-input w-11 h-13 text-center text-xl font-display font-semibold input-field rounded-lg border-border focus:border-blue-500 focus:ring-2 focus:ring-blue-500/15 transition-all" />
          <input type="text" maxlength="1"
            class="code-input w-11 h-13 text-center text-xl font-display font-semibold input-field rounded-lg border-border focus:border-blue-500 focus:ring-2 focus:ring-blue-500/15 transition-all" />
          <input type="text" maxlength="1"
            class="code-input w-11 h-13 text-center text-xl font-display font-semibold input-field rounded-lg border-border focus:border-blue-500 focus:ring-2 focus:ring-blue-500/15 transition-all" />
          <input type="text" maxlength="1"
            class="code-input w-11 h-13 text-center text-xl font-display font-semibold input-field rounded-lg border-border focus:border-blue-500 focus:ring-2 focus:ring-blue-500/15 transition-all" />
          <input type="text" maxlength="1"
            class="code-input w-11 h-13 text-center text-xl font-display font-semibold input-field rounded-lg border-border focus:border-blue-500 focus:ring-2 focus:ring-blue-500/15 transition-all" />
        </div>

        <button id="activate-btn"
          class="glow-btn relative w-full bg-gradient-to-r from-blue-600 to-sky-500 text-white py-3 rounded-lg text-sm font-semibold tracking-wide hover:opacity-90 transition-all flex items-center justify-center gap-2 shadow-lg shadow-blue-600/20 hover:shadow-blue-600/30 active:scale-[0.98] cursor-pointer">
          <i data-lucide="shield-check" class="w-4 h-4"></i> Ativar conta
        </button>

        <!-- Resend + Timer -->
        <div class="mt-5 flex items-center justify-between">
          <button id="resend-btn"
            class="text-xs text-blue-500 hover:text-blue-400 font-medium transition-colors cursor-pointer bg-transparent border-none p-0">
            Reenviar codigo
          </button>
          <div class="flex items-center gap-1.5">
            <i data-lucide="clock" class="w-3 h-3 text-text-muted/50"></i>
            <span id="timer" class="text-xs font-mono text-text-muted/70">10:00</span>
          </div>
        </div>

        <!-- Divider -->
        <div class="mt-6 pt-6 border-t border-border text-center">
          <p class="text-xs text-text-muted">
            Nao recebeu o email? Verifique sua caixa de <span class="font-medium text-text-main">spam</span>
            ou tente um
            <a href="registro.html" class="text-blue-500 hover:text-blue-400 font-medium transition-colors">novo cadastro</a>.
          </p>
        </div>
      </div>

      <p class="mt-6 text-center text-[10px] text-text-muted/50 font-mono">GENAI Platform &copy; 2026 &mdash; v2.4.1</p>
    </div>
  </div>

</body>
</html>
