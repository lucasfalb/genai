<!doctype html>
<html lang="pt-BR" class="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GENAI | Recuperar Senha</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@1.14.0/dist/umd/lucide.min.js"></script>
  <style type="text/tailwindcss">
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
    @import "tailwindcss";

    @theme {
      --font-sans: "Inter", ui-sans-serif, system-ui, sans-serif;
      --font-display: "Space Grotesk", ui-sans-serif, system-ui, sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, monospace;
      --color-canvas: var(--canvas);
      --color-surface: var(--surface);
      --color-surface-hover: var(--surface-hover);
      --color-border: var(--border);
      --color-border-hover: var(--border-hover);
      --color-text-main: var(--text-main);
      --color-text-muted: var(--text-muted);
    }

    :root {
      --canvas: #f8fafc;
      --surface: #ffffff;
      --surface-hover: #fbfcfd;
      --border: #e2e8f0;
      --border-hover: #cbd5e1;
      --text-main: #0f172a;
      --text-muted: #475569;
      --glow-opacity: 0.05;
    }

    .dark {
      --canvas: #0a0a0f;
      --surface: rgba(255, 255, 255, 0.03);
      --surface-hover: rgba(255, 255, 255, 0.06);
      --border: rgba(255, 255, 255, 0.07);
      --border-hover: rgba(255, 255, 255, 0.12);
      --text-main: #ffffff;
      --text-muted: #94a3b8;
      --glow-opacity: 0.15;
    }

    body {
      background-color: var(--canvas);
      color: var(--text-main);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

    .glass-card {
      background-color: var(--surface);
      border: 1px solid var(--border);
      transition: all 0.3s ease;
    }
    .glass-card:hover {
      background-color: var(--surface-hover);
      border-color: var(--border-hover);
    }

    .input-field {
      background-color: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-main);
      transition: all 0.2s ease;
    }
    .input-field:focus {
      outline: none;
      border-color: theme('colors.blue.500');
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.08);
      background-color: var(--surface-hover);
    }

    .glow-btn {
      position: relative;
      overflow: hidden;
    }
    .glow-btn::after {
      content: '';
      position: absolute;
      inset: -2px;
      border-radius: inherit;
      background: linear-gradient(135deg, rgba(59,130,246,0.3), rgba(6,182,212,0.3));
      opacity: 0;
      transition: opacity 0.3s ease;
      z-index: -1;
      filter: blur(8px);
    }
    .glow-btn:hover::after { opacity: 1; }
  </style>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();

      const themeToggle = document.getElementById('theme-toggle');
      const savedTheme = localStorage.getItem('theme');
      if (savedTheme === 'light') { document.documentElement.classList.remove('dark'); }
      if (savedTheme) { updateThemeIcon(); lucide.createIcons(); }

      themeToggle.addEventListener('click', () => {
        document.documentElement.classList.toggle('dark');
        updateThemeIcon();
        lucide.createIcons();
        localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
      });

      function updateThemeIcon() {
        const isDark = document.documentElement.classList.contains('dark');
        const icon = themeToggle.querySelector('i') || themeToggle.querySelector('svg');
        if (icon) icon.setAttribute('data-lucide', isDark ? 'sun' : 'moon');
      }

      // Toggle between email form and success state
      const form = document.getElementById('recovery-form');
      const sentState = document.getElementById('sent-state');
      const emailDisplay = document.getElementById('email-display');

      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const email = form.querySelector('input[type="email"]').value;
        if (email) {
          emailDisplay.textContent = email;
          form.classList.add('hidden');
          sentState.classList.remove('hidden');
          lucide.createIcons();
        }
      });
    });
  </script>
</head>

<body class="h-screen flex overflow-hidden selection:bg-blue-500/30 font-sans">

  <!-- Ambient Glows -->
  <div class="fixed top-[-15%] left-[-5%] w-[600px] h-[600px] rounded-full bg-blue-600/8 blur-[160px] pointer-events-none"></div>
  <div class="fixed bottom-[-15%] right-[-5%] w-[500px] h-[500px] rounded-full bg-cyan-600/5 blur-[140px] pointer-events-none"></div>

  <div class="flex-1 flex items-center justify-center p-6 relative z-10">
    <div class="w-full max-w-[420px]">

      <!-- Top bar -->
      <div class="flex items-center justify-between mb-10">
        <div class="flex items-center gap-2.5">
          <i data-lucide="bot" class="w-6 h-6 text-blue-500"></i>
          <span class="font-display font-semibold text-lg text-text-main tracking-tight">GENAI</span>
        </div>
        <button id="theme-toggle" title="Toggle Theme"
          class="p-2 rounded-lg glass-card text-text-muted hover:text-text-main transition-colors cursor-pointer">
          <i data-lucide="sun" class="w-4 h-4"></i>
        </button>
      </div>

      <!-- Recovery Card -->
      <div class="glass-card rounded-xl p-8">

        <!-- Back link -->
        <a href="login.html"
          class="inline-flex items-center gap-1.5 text-xs text-text-muted hover:text-blue-500 transition-colors mb-6">
          <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i> Voltar ao login
        </a>

        <!-- Icon -->
        <div class="w-14 h-14 rounded-2xl bg-amber-500/10 border border-amber-500/20 flex items-center justify-center mb-5">
          <i data-lucide="key-round" class="w-6 h-6 text-amber-400"></i>
        </div>

        <h2 class="text-xl font-display font-semibold text-text-main tracking-tight mb-1">Recuperar senha</h2>
        <p class="text-sm text-text-muted mb-6">Digite seu email e enviaremos um link para redefinir sua senha.</p>

        <!-- Email Form -->
        <form id="recovery-form" class="space-y-5">
          <div class="space-y-1.5">
            <label class="text-xs font-semibold uppercase tracking-widest text-text-muted font-display block">Email cadastrado</label>
            <div class="relative">
              <i data-lucide="mail" class="w-4 h-4 text-text-muted/40 absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none"></i>
              <input type="email" placeholder="seu@email.com" required autocomplete="email"
                class="input-field w-full rounded-lg pl-10 pr-4 py-3 text-sm placeholder:text-text-muted/40" />
            </div>
          </div>

          <button type="submit"
            class="glow-btn relative w-full bg-gradient-to-r from-blue-600 to-sky-500 text-white py-3 rounded-lg text-sm font-semibold tracking-wide hover:opacity-90 transition-all flex items-center justify-center gap-2 shadow-lg shadow-blue-600/20 hover:shadow-blue-600/30 active:scale-[0.98] cursor-pointer">
            <i data-lucide="send" class="w-4 h-4"></i> Enviar link de recuperacao
          </button>
        </form>

        <!-- Sent State -->
        <div id="sent-state" class="hidden space-y-5">
          <div class="p-4 rounded-lg bg-emerald-500/5 border border-emerald-500/15 flex items-start gap-3">
            <i data-lucide="check-circle-2" class="w-5 h-5 text-emerald-500 shrink-0 mt-0.5"></i>
            <div>
              <p class="text-sm font-medium text-emerald-500">Email enviado!</p>
              <p class="text-xs text-text-muted mt-1 leading-relaxed">
                Enviamos um link de recuperacao para <strong id="email-display" class="text-text-main font-medium"></strong>.
                Verifique sua caixa de entrada e spam.
              </p>
            </div>
          </div>

          <div class="p-4 rounded-lg bg-amber-500/5 border border-amber-500/15 flex items-start gap-3">
            <i data-lucide="clock" class="w-5 h-5 text-amber-500 shrink-0 mt-0.5"></i>
            <div>
              <p class="text-xs text-text-muted leading-relaxed">
                O link expira em <strong class="text-text-main font-medium">30 minutos</strong>.
                Nao recebeu? 
                <button type="button" onclick="document.getElementById('recovery-form').classList.remove('hidden'); this.closest('#sent-state').classList.add('hidden');"
                  class="text-blue-500 hover:text-blue-400 font-medium transition-colors cursor-pointer bg-transparent border-none p-0 text-xs">
                  Reenviar email
                </button>
              </p>
            </div>
          </div>
        </div>
      </div>

      <!-- Footer -->
      <p class="mt-6 text-center text-[10px] text-text-muted/50 font-mono">GENAI Platform &copy; 2026 &mdash; v2.4.1</p>
    </div>
  </div>

</body>
</html>
