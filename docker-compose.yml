services:
  redis:
    image: redis:7-alpine
    container_name: genai-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.14.1
    container_name: genai-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  minio:
    image: minio/minio:latest
    container_name: genai-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-genai}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-genai-local-secret}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.119.0
    container_name: genai-otel-collector
    restart: unless-stopped
    depends_on:
      - tempo
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:13133:13133"
    volumes:
      - ./otel-collector-config.yml:/etc/otel-collector-config.yml:ro
    command: ["--config", "/etc/otel-collector-config.yml"]
    # healthcheck omitted: grpc_health_probe binary not available in distroless image

  tempo:
    image: grafana/tempo:2.6.1
    container_name: genai-tempo
    restart: unless-stopped
    ports:
      - "127.0.0.1:3200:3200"
    volumes:
      - ./tempo-config.yml:/etc/tempo.yml:ro
    command: ["--config.file=/etc/tempo.yml"]

  grafana:
    image: grafana/grafana:11.5.2
    container_name: genai-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_INSTALL_PLUGINS: ""
    volumes:
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/dashboards-provisioning:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro

volumes:
  redis_data:
  qdrant_data:
  minio_data:
